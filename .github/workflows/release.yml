name: Release

# Builds the install zip and attaches it to the release, whether the release
# comes from pushing a v* tag or is created by hand on GitHub. The tag sets the
# version: release whatever is on main as v1.2.3 and the zip says 1.2.3.
# A release made from a tag push starts as a pre-release: only installs on the beta
# channel see it. To release it to everyone, edit it on GitHub, untick "Set as a
# pre-release" and tick "Set as the latest release". Same tag, same zip.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The tag is the version: package.json's version is only used for local builds,
      # so pull requests never touch it and never conflict over it.
      - name: Take the version from the tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $tag isn't a version like v1.2.3."
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
      - name: Pre-release unless the release already says otherwise
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "prerelease=${{ github.event.release.prerelease }}" >> "$GITHUB_OUTPUT"
          elif existing="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease 2>/dev/null)"; then
            echo "prerelease=$existing" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run package
      # Same zip under a fixed name, so /releases/latest/download/maillo.zip always works.
      - run: cp release/maillo-*.zip release/maillo.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*.zip
          generate_release_notes: ${{ github.event_name == 'push' }}
          prerelease: ${{ steps.kind.outputs.prerelease }}
